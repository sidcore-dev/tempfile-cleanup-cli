[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempfile-cleanup-cli"
version = "1.0.0"
description = "List (and optionally delete) files older than a given age in one or more directories you specify, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["cleanup", "cli", "devtools", "disk-space"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: System :: Filesystems",
]

[project.scripts]
tempfile-cleanup-cli = "tempfile_cleanup_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
